worker_processes 1;
pid /run/kenan-web/production.pid;
error_log stderr warn;
events { worker_connections 4096; }
http {
 include /etc/nginx/mime.types;
 access_log off;
 client_body_temp_path /run/kenan-web/body-production;
 proxy_temp_path /run/kenan-web/proxy-production;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 server {
  listen TAILNET_ADDRESS:18190;
  client_max_body_size 0;
  location / {
   proxy_pass http://unix:/run/kenan/production.sock;
   proxy_http_version 1.1;
   proxy_set_header Host $http_host;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_buffering off;
   proxy_request_buffering off;
   proxy_read_timeout 3600s;
   proxy_next_upstream off;
  }
 }
}
