# One memory budget for everything under user.slice: agent tool scopes (agent-tool-*.scope in user-UID.slice),
# every person's systemd user units, builds, benches and detached deploys. A runaway job is throttled, then
# OOM-killed inside this slice instead of pushing the host into swap. Policy: deploy/README.md "Compute priority".
[Slice]
MemoryHigh=40G
MemoryMax=44G
MemorySwapMax=0
MemoryLow=3G
