# kenan (uid 1000) is the agent administrator account. Its agent tool scopes run in user-agents.slice; what remains here
# is its user manager: the agents' browsers (app.slice/agent-browser-*), gpurun's preparers and drivers and emulators.
# Weight 400, twice user-agents.slice, because a browser step waits on its renderer: at 100 on 2026-10-31 (load 240)
# every agent browser missed its 25 s snapshot deadline while research batch commands filled user-agents.slice.
# Policy: deploy/README.md "Compute priority".
[Slice]
CPUWeight=400
IOWeight=10
MemoryLow=0
