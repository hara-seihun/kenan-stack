# Every agent's kenan-bg job (started by kenan-bg native launcher) runs in this one slice
# inside user-agents.slice, so all background jobs together weigh as much as one agent command. Before 2026-10-30 each
# job was its own sibling of the tool scopes: 17 jobs took 2.8 of the agents' 3.6 CPUs and every agent command got
# about 0.05 CPU, so a shell needed seconds per process and kenan-bg launches overran 10 s tool timeouts. Sorts after
# user-.slice.d/50-kenan-human.conf, which also matches this slice. Policy: deploy/README.md "Compute priority".
[Slice]
CPUWeight=10
IOWeight=10
MemoryLow=0
