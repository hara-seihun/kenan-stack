# Interactive: high CPU/IO weight and hard memory protection. Policy: /home/kenan/machine/compute-priority.md.
# The broker's working set is 1.5 GiB (peak 2.3 GiB on 2026-10-31). MemoryLow 512M and then 2G did not hold: under the
# multi-generational LRU memory.low is breached after one skip, and the broker refaulted thousands of anonymous pages a
# second from swap. MemoryMin is honoured; MemorySwapMax=0 keeps its heap out of swap above that too.
[Service]
CPUWeight=1000
IOWeight=1000
MemoryMin=2G
MemorySwapMax=0
