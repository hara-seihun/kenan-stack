# The slice must sit under user.slice (its one memory budget), so its name starts with user-, and systemd's
# user-.slice.d/10-defaults.conf gives it StopWhenUnneeded=yes as if it were a login user's slice. Then each time the
# last tool scope ended a stop job was queued, and a tool call starting in that moment failed with "Transaction ... is
# destructive (user-agents.slice has 'stop' job queued)". It stays up instead; deploy/agent-slice-check.sh proves it.
# Installed on every host. Policy: deploy/README.md "Compute priority".
[Unit]
StopWhenUnneeded=no
