# Keeps Chrome inside the agent-browser daemon's own service, so the daemon's exit (idle timeout, close, crash, kill -9)
# takes its whole Chrome tree with it (KillMode=control-group). With a session bus, Chrome moves its browser process into
# its own app-org.chromium.Chromium-PID.scope at startup and outlives the daemon (2026-10-31: found behind the 27-process
# Chrome pile-up alert). agent-browser runs Chrome with --password-store=basic, so no keyring needs the bus.
# Source: Kenan Stack deploy/priority-user/; regression check: deploy/chrome-reap.test.py.
[Service]
Environment=DBUS_SESSION_BUS_ADDRESS=disabled:
# A daemon with no command for 30 minutes shuts itself down (and its Chrome with it). Erin's and Dave's agents start daemons
# without AGENT_BROWSER_IDLE_TIMEOUT_MS and 25-hour-old idle ones piled up (2026-11-01); a client that sets its own value wins.
Environment=AGENT_BROWSER_IDLE_TIMEOUT_MS=1800000
