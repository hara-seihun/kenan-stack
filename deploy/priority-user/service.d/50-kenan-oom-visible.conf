# A user job killed for memory says so in its own output (journal or StandardOutput file), not just by stopping.
# Policy: deploy/README.md "Compute priority".
[Service]
ExecStopPost=-/bin/sh -c 'if [ "$$SERVICE_RESULT" = oom-kill ]; then echo "[kenan] %n was killed by the kernel OOM killer: user.slice memory budget (MemoryHigh 40G, MemoryMax 44G, 4G swap) or its own MemoryMax was exhausted. Details: journalctl --user -u %n; sudo journalctl -k -g %n"; fi'
